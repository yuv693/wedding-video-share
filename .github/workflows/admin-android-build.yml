name: Admin Android APK
on:
  push:
    branches: [main]
    paths:
      - 'admin_app/**'
      - '.github/workflows/admin-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: |
          if [ ! -f admin_app/android/gradlew ]; then
            flutter create --platforms=android --org com.weddingvideoshare --project-name wedding_video_share_admin admin_app
          fi
      - name: Configure admin sign-in deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("admin_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="weddingvideoshareadmin" android:host="login-callback" />
                  </intent-filter>
          '''
          if 'android:scheme="weddingvideoshareadmin"' not in s:
              s = s.replace("</activity>", intent + "\\n        </activity>")
              p.write_text(s)
          PY
      - name: Remove generated placeholder test
        run: rm -f admin_app/test/widget_test.dart
      - name: Build Admin APK
        working-directory: admin_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: wedding-video-share-admin-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
