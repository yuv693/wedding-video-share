name: Admin Android APK
on:
  push:
    branches: [main]
    paths:
      - 'admin_app/**'
      - '.github/workflows/admin-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: |
          if [ ! -f admin_app/android/gradlew ]; then
            flutter create --platforms=android --org com.weddingvideoshare --project-name wedding_video_share_admin admin_app
          fi
      - name: Configure Firebase Android app and Google Services plugin
        run: |
          set -euo pipefail
          test -f admin_app/firebase/google-services.json
          mkdir -p admin_app/android/app
          cp admin_app/firebase/google-services.json admin_app/android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('admin_app/android/settings.gradle.kts')
          app = Path('admin_app/android/app/build.gradle.kts')
          if not settings.exists() or not app.exists():
              raise SystemExit('Expected Kotlin Gradle files from Flutter Android template were not generated.')
          s = settings.read_text()
          plugin = '    id("com.google.gms.google-services") version "4.4.4" apply false\n'
          if 'com.google.gms.google-services' not in s:
              marker = 'plugins {\n'
              if marker not in s: raise SystemExit('settings.gradle.kts plugins block missing')
              s = s.replace(marker, marker + plugin, 1)
              settings.write_text(s)
          a = app.read_text()
          if 'com.google.gms.google-services' not in a:
              marker = 'plugins {\n'
              if marker not in a: raise SystemExit('app build.gradle.kts plugins block missing')
              a = a.replace(marker, marker + '    id("com.google.gms.google-services")\n', 1)
              app.write_text(a)
          print('Google Services plugin configured.')
          PY
      - name: Add Android internet and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("admin_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          if 'android.permission.INTERNET' not in s or 'android.permission.POST_NOTIFICATIONS' not in s:
              for line in permissions.splitlines(True):
                  if line.strip().split('"')[1] not in s:
                      s = s.replace('<application', line + '    <application', 1)
          metadata = '''        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="payment_requests" />
        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" />
'''
          if 'com.google.firebase.messaging.default_notification_channel_id' not in s:
              s = s.replace('</application>', metadata + '    </application>', 1)
          p.write_text(s)
          PY
      - name: Configure admin sign-in deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          p = Path("admin_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          # Android must deliver the Supabase callback to this Flutter activity.
          activity = re.search(r"<activity\b[^>]*>", s)
          if not activity:
              raise SystemExit("MainActivity <activity> tag not found")
          tag = activity.group(0)
          if "android:launchMode=" not in tag:
              s = s[:activity.start()] + tag[:-1] + ' android:launchMode="singleTop">' + s[activity.end():]

          intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="weddingvideoshareadmin" android:host="login-callback" />
                  </intent-filter>
          '''
          if 'android:scheme="weddingvideoshareadmin"' not in s:
              s = s.replace("</activity>", intent + "\n        </activity>", 1)

          p.write_text(s)
          ET.parse(p)
          print("AndroidManifest.xml valid; admin deep-link intent filter configured.")
          PY
      - name: Remove generated placeholder test
        run: rm -f admin_app/test/widget_test.dart
      - name: Build Admin APK
        working-directory: admin_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: wedding-video-share-admin-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
