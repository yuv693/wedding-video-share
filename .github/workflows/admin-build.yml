name: Admin APK Build
"on":
  push:
    branches:
      - main
    paths:
      - "admin_app/**"
      - ".github/workflows/admin-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-apk:
    name: Build Admin Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f admin_app/android/gradlew ]; then
            flutter create --platforms=android --org com.weddingvideoshare --project-name wedding_video_share_admin admin_app
          fi
          rm -f admin_app/test/widget_test.dart
          test -f admin_app/firebase/google-services.json
          mkdir -p admin_app/android/app
          cp admin_app/firebase/google-services.json admin_app/android/app/google-services.json
      - name: Use the exact Customer App launcher icon for Admin App
        run: |
          set -euo pipefail
          mkdir -p admin_app/android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable/wedding_icon.xml admin_app/android/app/src/main/res/drawable/wedding_icon.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("admin_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          import re
          s, n = re.subn(r'android:icon="@[^"]+"', 'android:icon="@drawable/wedding_icon"', s, count=1)
          if n == 0:
              s = s.replace("<application", '<application android:icon="@drawable/wedding_icon"', 1)
          p.write_text(s)
          if 'android:icon="@drawable/wedding_icon"' not in s:
              raise SystemExit("Admin launcher icon was not configured")
          print("Admin launcher icon now uses the exact Customer App wedding_icon.xml.")
          PY
      - name: Configure Firebase plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("admin_app/android/settings.gradle.kts")
          app = Path("admin_app/android/app/build.gradle.kts")
          s = settings.read_text()
          plugin = '    id("com.google.gms.google-services") version "4.4.4" apply false\n'
          if "com.google.gms.google-services" not in s:
              s = s.replace("plugins {\n", "plugins {\n" + plugin, 1)
              settings.write_text(s)
          a = app.read_text()
          if "com.google.gms.google-services" not in a:
              a = a.replace("plugins {\n", 'plugins {\n    id("com.google.gms.google-services")\n', 1)
          import re
          if "isCoreLibraryDesugaringEnabled" not in a:
              if re.search(r"compileOptions\s*\{", a):
                  a = re.sub(r"(compileOptions\s*\{)", r"\1\n        isCoreLibraryDesugaringEnabled = true", a, count=1)
              else:
                  a = a.replace("android {", "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }", 1)
          if "coreLibraryDesugaring(" not in a:
              a = a.rstrip() + "\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n"
          app.write_text(a)
          PY
      - name: Configure Android manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          p = Path("admin_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          for permission in [
              '    <uses-permission android:name="android.permission.INTERNET" />\n',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n',
          ]:
              name = permission.split('"')[1]
              if name not in s:
                  s = s.replace("<application", permission + "    <application", 1)
          metadata = '        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="payment_requests" />\n'
          if "com.google.firebase.messaging.default_notification_channel_id" not in s:
              s = s.replace("</application>", metadata + "    </application>", 1)
          activity = re.search(r"<activity\b[^>]*>", s)
          if not activity:
              raise SystemExit("MainActivity activity not found")
          tag = activity.group(0)
          if "android:launchMode=" not in tag:
              s = s[:activity.start()] + tag[:-1] + ' android:launchMode="singleTop">' + s[activity.end():]
          intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="weddingvideoshareadmin" android:host="login-callback" />
                  </intent-filter>
          '''
          if 'android:scheme="weddingvideoshareadmin"' not in s:
              s = s.replace("</activity>", intent + "\n        </activity>", 1)
          p.write_text(s)
          ET.parse(p)
          PY
      - name: Work around Android lint tooling crash in Firebase Core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/disable-firebase-release-lint.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.configureEach { task ->
                      if (task.name == "lintVitalAnalyzeRelease") {
                          task.enabled = false
                      }
                  }
              }
          }
          GRADLE
      - name: Build Admin APK
        working-directory: admin_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build apk --release
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: wedding-video-share-admin-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
