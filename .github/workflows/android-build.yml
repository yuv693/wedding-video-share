name: Android build

on:
  push:
    branches: [main, feature/wedding-studio-editor-and-customer-storage, feature/unified-wedding-share-free-modules]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify native video editor dependency
        run: flutter pub deps --style=compact | grep -E 'native_video_editor|pro_video_editor'

      - name: Analyze Dart and Flutter code
        run: flutter analyze lib --no-pub --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Create Android platform files if missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --project-name wedding_video_share .
          fi

      - name: Configure Google Drive return link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="weddingvideoshare" android:host="drive-connected" />
                  </intent-filter>
          '''
          if 'android:scheme="weddingvideoshare"' not in s:
              s = s.replace("</activity>", intent + "\\n        </activity>")
              p.write_text(s)
          PY

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              s = s.replace("compileSdk flutter.compileSdkVersion", "compileSdk 36")
              p.write_text(s)
          PY

      # Generated Android files are build inputs only. Do not commit or push
      # from a pull-request workflow: that can conflict with main and bypass review.

      - name: Configure Play Store release signing when secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] && [ -n "$ANDROID_STORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Play Store release signing configured."
          else
            echo "Release keystore secrets are not configured; this build will use the development signing key."
          fi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Build installable Android APK
        run: flutter build apk --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedding-video-share-android-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: wedding-video-share-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Install and launch APK on Android emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.weddingvideoshare.app 1
            sleep 8
            adb shell pidof com.weddingvideoshare.app

      - name: Publish direct-install Customer APK on GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: customer-latest
          target_commitish: main
          name: Wedding Video Share - Customer App
          body: |
            Customer Android APK for direct installation.
            This is a test distribution build, not a Play Store release.
          prerelease: true
          make_latest: false
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
          fail_on_unmatched_files: true
