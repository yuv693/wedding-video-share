name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create Android platform files if missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --project-name wedding_video_share .
          fi

      - name: Configure Google Drive return link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="weddingvideoshare" android:host="drive-connected" />
                  </intent-filter>
          '''
          if 'android:scheme="weddingvideoshare"' not in s:
              s = s.replace("</activity>", intent + "\\n        </activity>")
              p.write_text(s)
          PY

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedding-video-share-android-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
