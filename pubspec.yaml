name: wedding_video_share
description: Wedding Video Share Android application
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  app_links: ^6.4.0
  url_launcher: ^6.3.1
  razorpay_flutter: ^1.4.0
  file_picker: ^10.3.5
  http: ^1.2.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  pro_video_editor: ^2.54.1
  native_video_editor:
    git:
      url: https://github.com/MuhammadFahad0/native_video_editor.git
      ref: master
  video_player: ^2.9.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wedding_photo.jpg
